name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Runs every scenario on any branch, without a Kind cluster on a laptop.
  workflow_dispatch:

permissions:
  contents: read

env:
  HELM_VERSION: v4.3.1
  HELM_UNITTEST_VERSION: 1.0.3
  HELM_SCHEMA_VERSION: 1.8.0
  KUBECONFORM_VERSION: v0.8.0
  PROMETHEUS_VERSION: 3.16.0
  HELM_DOCS_VERSION: 1.14.2
  # The node images of tests/e2e/lib.sh and of the e2e matrix are built for this release.
  KIND_VERSION: v0.33.0

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install the Helm plugins, kubeconform, promtool and helm-docs
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest \
            --version "$HELM_UNITTEST_VERSION" --verify=false
          helm plugin install https://github.com/losisin/helm-values-schema-json \
            --version "$HELM_SCHEMA_VERSION" --verify=false
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" |
            sudo tar -xz -C /usr/local/bin kubeconform
          curl -fsSL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" |
            sudo tar -xz -C /usr/local/bin --strip-components=1 "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          curl -fsSL "https://github.com/norwoodj/helm-docs/releases/download/v${HELM_DOCS_VERSION}/helm-docs_${HELM_DOCS_VERSION}_Linux_x86_64.tar.gz" |
            sudo tar -xz -C /usr/local/bin helm-docs
      - run: make test

  e2e:
    name: e2e (Kubernetes ${{ matrix.kubernetes }})
    runs-on: ubuntu-latest
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          # The newest, the default node image of tests/e2e/lib.sh: every scenario on main.
          - kubernetes: "1.37"
            node-image: ""
            quick-only: false
          # The oldest, the kubeVersion of Chart.yaml: the quick scenarios.
          - kubernetes: "1.34"
            node-image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
            quick-only: true
    env:
      KIND_NODE_IMAGE: ${{ matrix.node-image }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}
      # Every Kind node restarted by the scenarios takes new inotify instances, and the
      # runner's default limit ran out halfway: kube-proxy then failed with "too many open
      # files" and took cluster DNS away from the pods of its node. Values from Kind's
      # known issues.
      - run: sudo sysctl -w fs.inotify.max_user_instances=512 fs.inotify.max_user_watches=524288
      # The kind of the runner image may not boot the pinned node images.
      - name: Install kind
        run: |
          curl -fsSLo "$RUNNER_TEMP/kind" "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          sudo install "$RUNNER_TEMP/kind" /usr/local/bin/kind
      # docker, kubectl and jq ship with the runner image.
      # A pull request gets the quick scenarios; main and release tags get all of them.
      - run: make ${{ (github.event_name == 'pull_request' || matrix.quick-only) && 'e2e-quick' || 'e2e' }}

  # The load generator and the dataset, for the scenarios run on a real cluster, which cannot
  # load a local image as Kind does.
  loadgen-image:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: tests/e2e/loadgen
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kvrocks-e2e-loadgen:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/kvrocks-e2e-loadgen:${{ github.ref_name == 'main' && 'latest' || github.ref_name }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [checks, e2e]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Check that the tag matches the chart version
        run: |
          chart_version=$(awk '$1 == "version:" { print $2 }' helm/kvrocks/Chart.yaml)
          [ "v${chart_version}" = "$GITHUB_REF_NAME" ] ||
            { echo "tag $GITHUB_REF_NAME does not match chart version $chart_version"; exit 1; }
      - name: Push the chart to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm package helm/kvrocks
          helm push kvrocks-*.tgz "oci://ghcr.io/${{ github.repository_owner }}/charts"
