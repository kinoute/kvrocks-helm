suite: HAProxy - PodDisruptionBudget
templates:
  - haproxy/poddisruptionbudget.yaml
release:
  name: db
  namespace: data
set:
  auth.password: test-password
tests:
  - it: protects the HAProxy pods in replication mode
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: metadata.name
          value: db-kvrocks-haproxy
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: kvrocks
            app.kubernetes.io/instance: db
            app.kubernetes.io/component: haproxy

  - it: lets one HAProxy pod be unavailable by default
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 1

  - it: uses haproxy.podDisruptionBudget.maxUnavailable
    set:
      haproxy.replicaCount: 4
      haproxy.podDisruptionBudget.maxUnavailable: 2
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 2

  - it: is absent when haproxy.podDisruptionBudget is disabled
    set:
      haproxy.podDisruptionBudget.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: is absent in standalone mode
    set:
      architecture: standalone
    asserts:
      - hasDocuments:
          count: 0
