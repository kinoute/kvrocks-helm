suite: Service - headless
templates:
  - service-headless.yaml
release:
  name: db
  namespace: data
set:
  auth.password: test-password
tests:
  - it: is named after the release with a -headless suffix
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: db-kvrocks-headless

  - it: is headless
    asserts:
      - equal:
          path: spec.clusterIP
          value: None

  - it: publishes the pods before they are ready
    asserts:
      - equal:
          path: spec.publishNotReadyAddresses
          value: true

  - it: selects the kvrocks pods
    asserts:
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: kvrocks
            app.kubernetes.io/instance: db
            app.kubernetes.io/component: kvrocks

  - it: exposes the kvrocks, sentinel and metrics ports in replication mode
    asserts:
      - equal:
          path: spec.ports
          value:
            - name: kvrocks
              port: 6379
              targetPort: kvrocks
            - name: sentinel
              port: 26379
              targetPort: 26379
            - name: metrics
              port: 9121
              targetPort: metrics

  - it: exposes no sentinel port in standalone mode
    set:
      architecture: standalone
    asserts:
      - equal:
          path: spec.ports
          value:
            - name: kvrocks
              port: 6379
              targetPort: kvrocks
            - name: metrics
              port: 9121
              targetPort: metrics

  - it: exposes no metrics port when metrics are disabled
    set:
      metrics.enabled: false
    asserts:
      - equal:
          path: spec.ports
          value:
            - name: kvrocks
              port: 6379
              targetPort: kvrocks
            - name: sentinel
              port: 26379
              targetPort: 26379

  - it: follows the port numbers set in values
    set:
      port: 6380
      sentinel.port: 26380
      metrics.port: 9122
    asserts:
      - equal:
          path: spec.ports
          value:
            - name: kvrocks
              port: 6380
              targetPort: kvrocks
            - name: sentinel
              port: 26380
              targetPort: 26380
            - name: metrics
              port: 9122
              targetPort: metrics
