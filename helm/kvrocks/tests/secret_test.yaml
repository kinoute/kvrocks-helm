suite: Secret
templates:
  - secret.yaml
release:
  name: db
  namespace: data
set:
  auth.password: test-password
tests:
  - it: is named after the release, where the pods read the password from
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: db-kvrocks

  - it: stores auth.password under the key password by default
    asserts:
      - equal:
          path: stringData
          value:
            password: test-password

  - it: stores auth.password under the key set in auth.secretKey
    set:
      auth.secretKey: kvrocks-password
    asserts:
      - equal:
          path: stringData
          value:
            kvrocks-password: test-password

  - it: keeps a password made of digits a string
    set:
      auth.password: "12345678"
    asserts:
      - equal:
          path: stringData.password
          value: "12345678"

  - it: is absent when auth.existingSecret is set, even with a password
    set:
      auth.existingSecret: my-credentials
    asserts:
      - hasDocuments:
          count: 0

  - it: is absent when auth is disabled
    set:
      auth.enabled: false
    asserts:
      - hasDocuments:
          count: 0
