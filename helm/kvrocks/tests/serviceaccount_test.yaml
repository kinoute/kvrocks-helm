suite: ServiceAccount
templates:
  - serviceaccount.yaml
release:
  name: db
  namespace: data
set:
  auth.password: test-password
tests:
  - it: is created by default and named after the release
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: db-kvrocks

  - it: takes the name set in serviceAccount.name
    set:
      serviceAccount.name: kvrocks-runner
    asserts:
      - equal:
          path: metadata.name
          value: kvrocks-runner

  - it: does not automount its token
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: carries serviceAccount.annotations
    set:
      serviceAccount.annotations:
        example.com/role: kvrocks
    asserts:
      - equal:
          path: metadata.annotations
          value:
            example.com/role: kvrocks

  - it: is absent when serviceAccount.create is false
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0
