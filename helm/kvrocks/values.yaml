# -- Overrides the chart name in resource names.
nameOverride: ""
# -- Overrides the full resource name prefix. The write Service takes exactly this name.
fullnameOverride: ""
# -- DNS domain of the cluster, used to build the pods' fully qualified names.
clusterDomain: cluster.local
# -- Labels added to every resource.
commonLabels: {} # @schema additionalProperties:true
# -- Annotations added to every resource, but not to the pods, where a change would restart
# them (`podAnnotations` and `haproxy.podAnnotations` are there for that), nor to the volume
# claims, which a StatefulSet cannot change.
commonAnnotations: {} # @schema additionalProperties:true

# Open to any key: as a dependency of another chart, this chart receives every global
# value of its parent.
global: # @schema additionalProperties:true
  # -- Registry that replaces the registry of every image (e.g. a pull-through cache).
  imageRegistry: ""
  # -- Pull secrets added to every pod.
  imagePullSecrets: []

# -- `replication`: one master and its replicas, with Sentinel failover and an HAProxy
# write endpoint. `standalone`: a single Kvrocks, no Sentinel, no HAProxy.
architecture: replication # @schema enum:[replication,standalone]

# -- Number of Kvrocks pods in `replication` mode: one master and two replicas. Only 3 is
# accepted, the only count the failure scenarios run with. Ignored in `standalone` mode.
replicaCount: 3 # @schema minimum:1

image:
  # -- Registry of the Kvrocks image.
  registry: docker.io
  # -- Repository of the Kvrocks image.
  repository: apache/kvrocks
  # -- Tag of the Kvrocks image. `replication` needs Kvrocks 2.16.0 or later.
  # @default -- the chart's `appVersion`
  tag: ""
  # -- Pins the image by digest; takes precedence over the tag.
  digest: ""
  # -- Pull policy of the Kvrocks image.
  pullPolicy: IfNotPresent # @schema enum:[Always,IfNotPresent,Never]

# Kvrocks and Sentinel always require a password.
auth:
  # -- Name of an existing Secret holding the password. Takes precedence over `password`.
  existingSecret: ""
  # -- Key of the password in the Secret.
  secretKey: password
  # -- Password stored in a Secret created by the chart. Prefer `existingSecret`.
  # It must not contain whitespace, double quotes or backslashes.
  password: ""

# -- Port clients reach Kvrocks on. With TLS it is the TLS port, and the traffic that stays
# inside the release (replication, Sentinel, probes, exporter) uses `tls.internalPort`.
port: 6379 # @schema minimum:1;maximum:65535

tls:
  # -- Serves clients over TLS on `port`. Replication, Sentinel, the probes and the exporter
  # stay in clear on `tls.internalPort`, which a NetworkPolicy then closes to every pod
  # outside the release.
  enabled: false
  # -- Port in clear for the traffic inside the release: Kvrocks cannot turn its plain
  # port off. On a release already installed, it must stay the port the pods already use:
  # see TLS in the README of the repository.
  internalPort: 6666 # @schema minimum:1;maximum:65535
  # -- Secret of type `kubernetes.io/tls` with the server certificate (`tls.crt`, `tls.key`).
  # It must cover the names clients connect to, such as the write Service.
  existingSecret: ""
  ca:
    # -- Secret with the CA bundle client certificates must chain to. Required with
    # `authClients`.
    secret: ""
    # -- Key of the bundle in that Secret.
    key: ca.crt
  # -- Requires clients to present a certificate signed by that CA (mTLS).
  authClients: true
  # -- TLS versions Kvrocks accepts.
  protocols: TLSv1.3
  # -- Secret of type `kubernetes.io/tls` with a client certificate signed by the CA, used
  # by `helm test`. Without it and with `authClients`, `helm test` has nothing to run.
  clientSecret: ""
  # -- Annotates the StatefulSet so that Reloader restarts it, one handover at a time,
  # when the certificate Secrets change.
  reloader: false

# -- Extra `kvrocks.conf` settings, as `key: value`. Settings the chart owns (bind, port,
# dir, the password, the replication role and priority...) are rejected, and so are
# `rename-command`, which would hide from the chart's scripts the commands they rely on,
# and the namespace tokens, which are credentials.
config: # @schema additionalProperties:true
  # Without this, a former master that comes back with unreplicated writes can resume
  # replication from its sequence number alone and silently diverge from the new master.
  use-rsid-psync: "yes" # @schema type:[string,boolean]

persistence:
  # -- Keeps the data on a PersistentVolumeClaim per pod. `replication` requires it. In
  # `standalone` mode, without it, the data lives in an `emptyDir` and is lost with the pod.
  enabled: true
  # -- StorageClass of the volumes.
  # @default -- the cluster's default StorageClass
  storageClass: ""
  # -- Access modes of the volumes.
  accessModes:
    - ReadWriteOnce
  # -- Size of each volume. A StatefulSet cannot change it afterwards: see "Sizing" in the
  # repository's README.
  size: 10Gi
  # -- Annotations of the volume claims.
  annotations: {} # @schema additionalProperties:true
  # -- Labels of the volume claims.
  labels: {} # @schema additionalProperties:true
  retentionPolicy:
    # -- What becomes of the volume claims when the StatefulSet is deleted, by
    # `helm uninstall` for instance: `Retain` keeps them with the data, `Delete` deletes them.
    whenDeleted: Retain # @schema enum:[Retain,Delete]

# -- Resources of the Kvrocks container. Without any, the pods run as BestEffort and are the
# first evicted under memory pressure. Kvrocks caches up to 4 GB of blocks by default, on
# top of its write buffers: with a memory limit, shrink that cache in `config`, or the
# master is killed for running out of memory, with no handover. The example below is what
# the scenarios run with on a real cluster.
resources: {} # @schema additionalProperties:true
#  requests:
#    cpu: 500m
#    memory: 1Gi
#  limits:
#    memory: 3Gi
# and in `config`:
#  rocksdb.block_cache_size: 1024

# -- Annotations of the Kvrocks pods.
podAnnotations: {} # @schema additionalProperties:true
# -- Labels of the Kvrocks pods.
podLabels: {} # @schema additionalProperties:true
# -- Node selector of the Kvrocks pods.
nodeSelector: {} # @schema additionalProperties:true
# -- Tolerations of the Kvrocks pods.
tolerations: []
# -- Topology spread constraints of the Kvrocks pods.
topologySpreadConstraints: []
# -- PriorityClass of the Kvrocks pods.
priorityClassName: ""
# -- `hard`: one Kvrocks pod per node, or the pod stays Pending. Two pods on one node lose
# the Sentinel majority, and any failover, together with that node. `soft` only prefers it,
# for clusters with fewer nodes than pods. Ignored when `affinity` is set.
podAntiAffinity: hard # @schema enum:[hard,soft]
# -- Replaces the default affinity entirely.
affinity: {} # @schema additionalProperties:true

# -- Extra environment variables of the kvrocks container, as Kubernetes `env` entries. The
# names the chart sets are rejected.
extraEnv: []
# -- Extra volumes of the Kvrocks pods, for `extraVolumeMounts` and `sidecars`. The names of
# the chart's volumes (`data`, `config`, `scripts`, `tmp`, `tls-server`, `tls-ca`) are rejected.
extraVolumes: []
# -- Extra volume mounts of the kvrocks container. Paths under the chart's own mounts
# (`/var/lib/kvrocks`, `/etc/kvrocks`, `/scripts`, `/tmp`, `/tls`) are rejected.
extraVolumeMounts: []
# -- Extra containers of the Kvrocks pods, a backup agent for instance, which can mount the
# `data` volume. A sidecar that is not ready makes its pod not ready, which the read Service
# and the PodDisruptionBudget count.
sidecars: []

# -- Seconds a pod gets to stop: the master handover, then Kvrocks flushing its WAL. At
# least `switchover.pauseMilliseconds` plus `sentinel.failoverTimeoutMilliseconds`, plus 30 s.
terminationGracePeriodSeconds: 120

# -- Security context of the Kvrocks pods. 999 is the user of the Kvrocks image.
podSecurityContext: # @schema additionalProperties:true
  runAsNonRoot: true
  runAsUser: 999
  runAsGroup: 999
  fsGroup: 999
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile: # @schema additionalProperties:true
    type: RuntimeDefault

# -- Security context of every container of the Kvrocks pods.
containerSecurityContext: # @schema additionalProperties:true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: # @schema additionalProperties:true
    drop:
      - ALL

# -- Kvrocks only listens once its database is open, which takes time on a large volume:
# the startup probe allows `failureThreshold * periodSeconds` (20 minutes by default).
startupProbe: # @schema additionalProperties:true
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 240

# -- Restarts a Kvrocks that stops answering for a minute. The Sentinel and exporter
# sidecars take the same timings.
livenessProbe: # @schema additionalProperties:true
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

# -- A replica is ready once it follows the master, has finished syncing and holds every
# write the master held a moment before. The Sentinel sidecar takes the same timings.
readinessProbe: # @schema additionalProperties:true
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 3

podDisruptionBudget:
  # -- Creates a PodDisruptionBudget for the Kvrocks pods.
  enabled: true
  # -- Kvrocks pods a voluntary disruption, such as a drain, may stop at once. At most 1,
  # so that a drain leaves a majority of the three Sentinels.
  maxUnavailable: 1

serviceAccount:
  # -- Creates a ServiceAccount for the pods. None of them talks to the Kubernetes API.
  create: true
  # -- Name of the ServiceAccount.
  # @default -- the release's full name with `create`, else `default`
  name: ""
  # -- Annotations of the ServiceAccount.
  annotations: {} # @schema additionalProperties:true

# The write endpoint: HAProxy in `replication` mode, the single pod in `standalone` mode.
service:
  # -- Type of the write Service.
  type: ClusterIP # @schema enum:[ClusterIP,NodePort,LoadBalancer]
  # -- Port of the write Service.
  port: 6379 # @schema minimum:1;maximum:65535
  # -- Node port of the write endpoint, with `type: NodePort`. Empty lets Kubernetes pick.
  nodePort: "" # @schema type:[string,integer]
  # -- Client addresses allowed through, as CIDRs, with `type: LoadBalancer`. Empty lets any
  # address through.
  loadBalancerSourceRanges: []
  # -- Annotations of the write Service.
  annotations: {} # @schema additionalProperties:true

readService:
  # -- Creates a second Service that spreads reads over every ready pod, replicas
  # included. Replication is asynchronous: a read may return slightly stale data.
  enabled: true
  # -- Type of the read Service.
  type: ClusterIP # @schema enum:[ClusterIP,NodePort,LoadBalancer]
  # -- Port of the read Service.
  port: 6379 # @schema minimum:1;maximum:65535
  # -- Node port of the read Service, with `type: NodePort`. Empty lets Kubernetes pick.
  nodePort: "" # @schema type:[string,integer]
  # -- Client addresses allowed through, as CIDRs, with `type: LoadBalancer`. Empty lets any
  # address through.
  loadBalancerSourceRanges: []
  # -- Annotations of the read Service.
  annotations: {} # @schema additionalProperties:true

sentinel:
  # -- Image Sentinel runs from: Valkey's, whose Sentinel works with Kvrocks. Same fields
  # as `image`.
  image:
    registry: docker.io
    repository: valkey/valkey
    tag: 9.0.6-alpine
    digest: ""
    pullPolicy: IfNotPresent # @schema enum:[Always,IfNotPresent,Never]
  # -- Port of Sentinel.
  port: 26379 # @schema minimum:1;maximum:65535
  # -- Name Sentinel knows the master by; Sentinel-aware clients need it.
  masterName: kvrocks # @schema pattern:^[A-Za-z0-9._-]+$
  # -- Milliseconds a master must be unreachable before Sentinel declares it down.
  # A crash failover takes a little longer than this.
  downAfterMilliseconds: 10000 # @schema minimum:1
  # -- Milliseconds before Sentinel retries a failover that did not complete.
  failoverTimeoutMilliseconds: 60000 # @schema minimum:1
  # -- Replicas re-synced at the same time after a failover.
  parallelSyncs: 1 # @schema minimum:1
  # -- Resources of the Sentinel sidecar.
  resources: {} # @schema additionalProperties:true

switchover:
  # -- Milliseconds client writes are paused while the master hands its role over
  # (rolling update, drain). Must be lower than `sentinel.downAfterMilliseconds`,
  # or Sentinel declares the paused master down.
  pauseMilliseconds: 5000 # @schema minimum:4000

fencing:
  # -- Pauses the writes of a master that neither a majority of Sentinels nor its replicas
  # follow any more, as when it is cut off from its peers. Kvrocks has no
  # min-replicas-to-write: without fencing, connections already open to such a master keep
  # writing to it until the partition heals, and all those writes are lost. The cost: a
  # healthy master also stops taking writes when it is left without a majority of the pods,
  # two down out of three for instance, as HAProxy already does.
  enabled: true
  # -- Resources of the fencing sidecar.
  resources: {} # @schema additionalProperties:true

# HAProxy, the write endpoint in `replication` mode.
haproxy:
  # -- Image of HAProxy. Same fields as `image`.
  image:
    registry: docker.io
    repository: haproxy
    tag: 3.2.25-alpine
    digest: ""
    pullPolicy: IfNotPresent # @schema enum:[Always,IfNotPresent,Never]
  # -- Number of HAProxy pods. They share no state: any of them routes to the same master.
  replicaCount: 2 # @schema minimum:1
  # -- Client connections each HAProxy pod accepts.
  maxConnections: 10000 # @schema minimum:1
  # -- How long HAProxy keeps the last known address of a pod when cluster DNS stops answering.
  dnsOutageTolerance: 1h
  # -- Port of the health endpoints (`/livez`, `/readyz`) and of `/metrics`.
  healthPort: 8888 # @schema minimum:1;maximum:65535
  check:
    # -- How often HAProxy asks each Sentinel for the master and each Kvrocks for its role.
    interval: 1s
    # -- Failed role checks in a row before HAProxy cuts the connections to a Kvrocks.
    # Higher than 1 so that one slow answer from a busy master does not drop every client.
    # Keep `fall` times `interval` well under `switchover.pauseMilliseconds`: after a
    # handover, the former master holds writes that long, and HAProxy must cut the
    # connections still open to it first.
    fall: 3 # @schema minimum:1
  # -- Restarts an HAProxy whose health endpoint stops answering.
  livenessProbe: # @schema additionalProperties:true
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  # -- HAProxy is ready while it can reach the master Sentinel agrees on.
  readinessProbe: # @schema additionalProperties:true
    periodSeconds: 2
    timeoutSeconds: 2
    failureThreshold: 2
  timeouts:
    # -- Time to open a connection to a Kvrocks or a Sentinel.
    connect: 4s
    # -- Time a health check, of a Sentinel or of a Kvrocks, may take.
    check: 2s
    # -- Idle time after which a client connection is closed. Clients that keep idle
    # pooled connections reconnect transparently.
    client: 1d
    # -- Idle time after which the connection to Kvrocks is closed.
    server: 1d
  # -- Resources of the HAProxy pods.
  resources: {} # @schema additionalProperties:true
  # -- Annotations of the HAProxy pods.
  podAnnotations: {} # @schema additionalProperties:true
  # -- Labels of the HAProxy pods.
  podLabels: {} # @schema additionalProperties:true
  # -- Node selector of the HAProxy pods.
  nodeSelector: {} # @schema additionalProperties:true
  # -- Tolerations of the HAProxy pods.
  tolerations: []
  # -- Topology spread constraints of the HAProxy pods.
  topologySpreadConstraints: []
  # -- PriorityClass of the HAProxy pods.
  priorityClassName: ""
  # -- Replaces the default affinity, which prefers one HAProxy pod per node.
  affinity: {} # @schema additionalProperties:true
  # -- Seconds an HAProxy pod gets to stop.
  terminationGracePeriodSeconds: 30
  # -- Security context of the HAProxy pods. 99 is the user of the HAProxy image.
  podSecurityContext: # @schema additionalProperties:true
    runAsNonRoot: true
    runAsUser: 99
    runAsGroup: 99
    seccompProfile: # @schema additionalProperties:true
      type: RuntimeDefault
  podDisruptionBudget:
    # -- Creates a PodDisruptionBudget for the HAProxy pods.
    enabled: true
    # -- HAProxy pods a voluntary disruption may stop at once.
    maxUnavailable: 1

metrics:
  # -- Runs kvrocks_exporter next to each Kvrocks, and exposes HAProxy's own metrics.
  enabled: true
  # -- Image of kvrocks_exporter. Same fields as `image`.
  image:
    registry: docker.io
    repository: kvrocks/kvrocks-exporter
    tag: 1.0.11
    digest: ""
    pullPolicy: IfNotPresent # @schema enum:[Always,IfNotPresent,Never]
  # -- Port of kvrocks_exporter.
  port: 9121 # @schema minimum:1;maximum:65535
  # -- Resources of the exporter sidecar.
  resources: {} # @schema additionalProperties:true
  serviceMonitor:
    # -- Scrapes the exporters and HAProxy. Requires the Prometheus Operator CRDs.
    enabled: false
    # -- Labels your Prometheus selects ServiceMonitors by (e.g. `release: prometheus`).
    labels: {} # @schema additionalProperties:true
    # -- Scrape interval.
    interval: 30s
    # -- Scrape timeout.
    scrapeTimeout: 10s
    # -- Relabelings applied before the scrape.
    relabelings: []
    # -- Relabelings applied to the scraped samples.
    metricRelabelings: []
  prometheusRule:
    # -- Installs the alerts listed in the repository's README. Requires the Prometheus
    # Operator CRDs.
    enabled: false
    # -- Labels your Prometheus selects PrometheusRules by.
    labels: {} # @schema additionalProperties:true
    # -- Labels added to every alert.
    alertLabels: {} # @schema additionalProperties:true
    # -- Minutes a condition must hold before its alert fires.
    forMinutes: 2
    # -- Disk usage ratio above which the disk alert fires.
    diskUsageThreshold: 0.8 # @schema minimum:0;maximum:1

networkPolicy:
  # -- Restricts ingress to the Kvrocks and HAProxy pods. With TLS, a NetworkPolicy is
  # installed anyway, to keep the port in clear inside the release.
  enabled: false
  # -- Peers allowed to reach the write endpoint and the read Service, as
  # NetworkPolicy `from` entries. Empty allows every pod of the cluster.
  clientsFrom: []
  # -- Peers allowed to scrape the metrics, as NetworkPolicy `from` entries.
  # Empty allows every pod of the cluster.
  metricsFrom: []
