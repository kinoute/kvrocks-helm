{{- $replication := include "kvrocks.isReplication" . }}
{{- $selectorLabels := include "kvrocks.selectorLabels" (dict "root" . "component" "kvrocks") }}
{{- $annotations := dict }}
{{- if and .Values.tls.enabled .Values.tls.reloader }}
{{- $_ := set $annotations "secret.reloader.stakater.com/reload" (compact (list .Values.tls.existingSecret .Values.tls.ca.secret) | join ",") }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "kvrocks.fullname" . }}
  labels:
    {{- include "kvrocks.labels" . | nindent 4 }}
    app.kubernetes.io/component: kvrocks
  {{- with include "kvrocks.annotations" (dict "root" . "own" $annotations) }}
  {{- . | nindent 2 }}
  {{- end }}
spec:
  replicas: {{ include "kvrocks.replicaCount" . }}
  serviceName: {{ include "kvrocks.headlessServiceName" . }}
  # Pods start together. With ordered startup, a full restart would deadlock: a replica
  # is only ready once it has reached its master, which may be a pod that starts later.
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  {{- if .Values.persistence.enabled }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: {{ .Values.persistence.retentionPolicy.whenDeleted }}
    # The pod count never shrinks: replication runs exactly 3 pods, standalone 1.
    whenScaled: Retain
  {{- end }}
  selector:
    matchLabels:
      {{- $selectorLabels | nindent 6 }}
  template:
    metadata:
      # Nothing that changes with the chart version: every new chart would restart every pod.
      labels:
        {{- $selectorLabels | nindent 8 }}
        {{- with .Values.commonLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # The data only: the labels of the ConfigMap carry the chart version.
        checksum/config: {{ (include (print $.Template.BasePath "/configmap.yaml") . | fromYaml).data | toJson | sha256sum }}
        kubectl.kubernetes.io/default-container: kvrocks
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "kvrocks.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- if $replication }}
      # The pause container reaps orphaned processes. Otherwise they are reparented to
      # Sentinel, which logs a warning for each: the probes leave one every few seconds.
      shareProcessNamespace: true
      {{- end }}
      {{- include "kvrocks.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      affinity:
        {{- if .Values.affinity }}
        {{- toYaml .Values.affinity | nindent 8 }}
        {{- else }}
        {{- with .Values.nodeAffinity }}
        nodeAffinity:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        # Two Kvrocks pods on one node: losing that node loses the Sentinel majority, and
        # with it any failover. Hence one pod per node unless podAntiAffinity says soft.
        podAntiAffinity:
          {{- if eq .Values.podAntiAffinity "hard" }}
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- $selectorLabels | nindent 18 }}
          {{- else }}
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- $selectorLabels | nindent 20 }}
          {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $replication }}
      # Sidecars: they start before Kvrocks and Kubernetes only stops them once Kvrocks has
      # exited, so Sentinel is still there when the preStop hook hands the master role over.
      initContainers:
        - name: sentinel
          image: {{ include "kvrocks.image" (dict "root" . "image" .Values.sentinel.image "defaultTag" "") }}
          imagePullPolicy: {{ .Values.sentinel.image.pullPolicy }}
          restartPolicy: Always
          command: ["/scripts/sentinel-start.sh"]
          env:
            {{- include "kvrocks.topologyEnv" . | nindent 12 }}
            - name: SENTINEL_QUORUM
              value: {{ include "kvrocks.majority" . | quote }}
            - name: SENTINEL_DOWN_AFTER_MS
              value: {{ .Values.sentinel.downAfterMilliseconds | int64 | quote }}
            - name: SENTINEL_PARALLEL_SYNCS
              value: {{ .Values.sentinel.parallelSyncs | quote }}
          ports:
            - name: sentinel
              containerPort: {{ .Values.sentinel.port }}
          # A TCP check: during a cluster DNS outage, Sentinel resolves hostnames on the spot
          # and stops answering for seconds at a time. Restarting it then would only make
          # it forget what it was doing.
          livenessProbe:
            tcpSocket:
              port: {{ .Values.sentinel.port }}
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            exec:
              command: ["/scripts/sentinel-probe.sh"]
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- with .Values.sentinel.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/kvrocks
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
        {{- if .Values.fencing.enabled }}
        - name: fence
          image: {{ include "kvrocks.image" (dict "root" . "image" .Values.image "defaultTag" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          restartPolicy: Always
          command: ["/scripts/kvrocks-fence.sh"]
          env:
            {{- include "kvrocks.topologyEnv" . | nindent 12 }}
          {{- with .Values.fencing.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            # Shared with the kvrocks container: there the handover writes down how long
            # it holds writes paused, and the fence must not lift that pause.
            - name: tmp
              mountPath: /tmp
        {{- end }}
      {{- end }}
      containers:
        - name: kvrocks
          image: {{ include "kvrocks.image" (dict "root" . "image" .Values.image "defaultTag" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/scripts/kvrocks-start.sh"]
          env:
            {{- include "kvrocks.topologyEnv" . | nindent 12 }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: kvrocks
              containerPort: {{ .Values.port }}
            {{- if .Values.tls.enabled }}
            - name: internal
              containerPort: {{ .Values.tls.internalPort }}
            {{- end }}
          startupProbe:
            exec:
              command: ["/scripts/kvrocks-probe.sh", "startup"]
            {{- toYaml .Values.startupProbe | nindent 12 }}
          livenessProbe:
            exec:
              command: ["/scripts/kvrocks-probe.sh", "liveness"]
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            exec:
              command: ["/scripts/kvrocks-probe.sh", "readiness"]
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          lifecycle:
            preStop:
              exec:
                command: ["/scripts/kvrocks-prestop.sh"]
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/kvrocks
            - name: config
              mountPath: /etc/kvrocks
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if .Values.tls.enabled }}
            - name: tls-server
              mountPath: /tls/server
              readOnly: true
            {{- if .Values.tls.ca.secret }}
            - name: tls-ca
              mountPath: /tls/ca
              readOnly: true
            {{- end }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- if .Values.metrics.enabled }}
        - name: metrics
          image: {{ include "kvrocks.image" (dict "root" . "image" .Values.metrics.image "defaultTag" "") }}
          imagePullPolicy: {{ .Values.metrics.image.pullPolicy }}
          env:
            - name: KVROCKS_ADDR
              value: redis://localhost:{{ include "kvrocks.internalPort" . }}
            {{- include "kvrocks.passwordEnv" . | nindent 12 }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          {{- with .Values.metrics.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
        {{- end }}
        {{- with .Values.sidecars }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "kvrocks.fullname" . }}
        - name: scripts
          configMap:
            name: {{ include "kvrocks.scriptsConfigMapName" . }}
            defaultMode: 0555
        # Writable scratch space with a read-only root filesystem: the pid file, Sentinel's
        # dir, and the write pauses the handover and the fence hold.
        - name: tmp
          emptyDir: {}
        {{- if .Values.tls.enabled }}
        - name: tls-server
          secret:
            secretName: {{ .Values.tls.existingSecret }}
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        {{- if .Values.tls.ca.secret }}
        - name: tls-ca
          secret:
            secretName: {{ .Values.tls.ca.secret }}
            defaultMode: 0444
            items:
              - key: {{ .Values.tls.ca.key }}
                path: ca.crt
        {{- end }}
        {{- end }}
        {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        {{- with .Values.persistence.labels }}
        labels:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
