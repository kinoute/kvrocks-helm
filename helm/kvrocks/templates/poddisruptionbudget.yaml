{{- if and .Values.podDisruptionBudget.enabled (include "kvrocks.isReplication" .) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "kvrocks.fullname" . }}
  labels:
    {{- include "kvrocks.labels" . | nindent 4 }}
    app.kubernetes.io/component: kvrocks
  {{- with include "kvrocks.annotations" (dict "root" .) }}
  {{- . | nindent 2 }}
  {{- end }}
spec:
  # A replica that is still syncing is not ready and counts as unavailable, so a drain
  # never takes a second pod while one is catching up.
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "kvrocks.selectorLabels" (dict "root" . "component" "kvrocks") | nindent 6 }}
{{- end }}
