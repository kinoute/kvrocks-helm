apiVersion: v1
kind: Service
metadata:
  name: {{ include "kvrocks.headlessServiceName" . }}
  labels:
    {{- include "kvrocks.labels" . | nindent 4 }}
    app.kubernetes.io/component: kvrocks
spec:
  type: ClusterIP
  clusterIP: None
  # Pods must resolve each other before they are ready: a replica is only ready once it
  # has reached its master, and Sentinel refuses to start on an unresolvable master.
  publishNotReadyAddresses: true
  ports:
    - name: kvrocks
      port: {{ .Values.port }}
      targetPort: kvrocks
    {{- if .Values.tls.enabled }}
    - name: internal
      port: {{ .Values.tls.internalPort }}
      targetPort: internal
    {{- end }}
    {{- if include "kvrocks.isReplication" . }}
    - name: sentinel
      port: {{ .Values.sentinel.port }}
      # A number: the port belongs to a sidecar, which named ports are not resolved against.
      targetPort: {{ .Values.sentinel.port }}
    {{- end }}
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
    {{- end }}
  selector:
    {{- include "kvrocks.selectorLabels" (dict "root" . "component" "kvrocks") | nindent 4 }}
