{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kvrocks.fullname" . }}
  labels:
    {{- include "kvrocks.labels" . | nindent 4 }}
  {{- with include "kvrocks.annotations" (dict "root" .) }}
  {{- . | nindent 2 }}
  {{- end }}
type: Opaque
stringData:
  {{ .Values.auth.secretKey }}: {{ .Values.auth.password | quote }}
{{- end }}
