{{- include "kvrocks.validate" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kvrocks.fullname" . }}
  labels:
    {{- include "kvrocks.labels" . | nindent 4 }}
data:
  # The container appends its announce address, the password and its replication role
  # to a writable copy of this file at startup: Kvrocks rewrites its config on failover.
  kvrocks.conf: |
    bind 0.0.0.0
    port {{ .Values.port }}
    dir /var/lib/kvrocks
    pidfile /tmp/kvrocks.pid
    log-dir stdout
    daemonize no
    cluster-enabled no
    {{- range $key, $value := .Values.config }}
    {{ $key }} {{ include "kvrocks.configValue" $value }}
    {{- end }}
