{{- $haproxy := include "kvrocks.isReplication" . }}
{{- /* The write endpoint. With replication it must only ever reach the master: HAProxy's job. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kvrocks.fullname" . }}
  labels:
    {{- include "kvrocks.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ ternary "haproxy" "kvrocks" (not (empty $haproxy)) }}
  {{- with include "kvrocks.annotations" (dict "root" . "own" .Values.service.annotations) }}
  {{- . | nindent 2 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: kvrocks
      port: {{ .Values.service.port }}
      targetPort: kvrocks
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    {{- include "kvrocks.selectorLabels" (dict "root" . "component" (ternary "haproxy" "kvrocks" (not (empty $haproxy)))) | nindent 4 }}
