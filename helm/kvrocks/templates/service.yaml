{{- $haproxy := include "kvrocks.haproxyEnabled" . }}
{{- /*
The write endpoint. With replication it must only ever reach the master, which is
HAProxy's job. Replication without HAProxy has no such endpoint: clients ask Sentinel.
*/}}
{{- if or $haproxy (not (include "kvrocks.isReplication" .)) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kvrocks.fullname" . }}
  labels:
    {{- include "kvrocks.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ ternary "haproxy" "kvrocks" (not (empty $haproxy)) }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: kvrocks
      port: {{ .Values.service.port }}
      targetPort: kvrocks
  selector:
    {{- include "kvrocks.selectorLabels" (dict "root" . "component" (ternary "haproxy" "kvrocks" (not (empty $haproxy)))) | nindent 4 }}
{{- end }}
