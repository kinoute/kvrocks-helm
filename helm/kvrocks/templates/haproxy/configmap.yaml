{{- if include "kvrocks.haproxyEnabled" . }}
{{- $majority := include "kvrocks.majority" . }}
{{- $ordinals := until (int .Values.replicaCount) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kvrocks.fullname" . }}-haproxy
  labels:
    {{- include "kvrocks.labels" . | nindent 4 }}
    app.kubernetes.io/component: haproxy
data:
  haproxy.cfg: |
    global
      log stdout format raw local0 notice
      maxconn {{ .Values.haproxy.maxConnections | int64 }}

    defaults
      mode tcp
      log global
      timeout connect {{ .Values.haproxy.timeouts.connect }}
      timeout check {{ .Values.haproxy.timeouts.check }}
      timeout client {{ .Values.haproxy.timeouts.client }}
      timeout server {{ .Values.haproxy.timeouts.server }}
      # The idle timeouts are long; TCP keepalive is what detects a peer that vanished.
      option clitcpka
      option srvtcpka
      # Pod IPs change on restart: resolve at runtime, and start even if a pod is not in DNS yet.
      default-server init-addr last,libc,none resolvers cluster_dns resolve-prefer ipv4

    resolvers cluster_dns
      parse-resolv-conf
      hold valid 1s
      # Through a DNS outage, keep the last address of each pod instead of dropping the
      # servers: the health checks, not DNS, decide whether a pod is usable.
      hold timeout {{ .Values.haproxy.dnsOutageTolerance }}
      hold refused {{ .Values.haproxy.dnsOutageTolerance }}
      hold other {{ .Values.haproxy.dnsOutageTolerance }}

    frontend health
      mode http
      bind :{{ .Values.haproxy.healthPort }}
      http-request return status 200 content-type text/plain string "alive" if { path /livez }
      # Ready only while a master is reachable: an HAProxy cut off from the Sentinels
      # leaves the Service instead of refusing connections.
      {{- range $ordinal := $ordinals }}
      http-request return status 200 content-type text/plain string "master reachable" if { path /readyz } { nbsrv(sentinel_votes_{{ $ordinal }}) ge {{ $majority }} } { nbsrv(kvrocks_{{ $ordinal }}) ge 1 }
      {{- end }}
      http-request return status 503 content-type text/plain string "no reachable master" if { path /readyz }
      {{- if .Values.metrics.enabled }}
      http-request use-service prometheus-exporter if { path /metrics }
      {{- end }}

    # Writes go to the pod that a majority of Sentinels names as master, never to a pod that
    # merely claims the role: a former master still claims it until it is demoted.
    frontend kvrocks_write
      bind :{{ .Values.port }}
      {{- range $ordinal := $ordinals }}
      use_backend kvrocks_{{ $ordinal }} if { nbsrv(sentinel_votes_{{ $ordinal }}) ge {{ $majority }} }
      {{- end }}
      default_backend no_master

    # No majority of Sentinels agrees on a master: refuse connections rather than guess.
    backend no_master
    {{- range $ordinal := $ordinals }}
    {{- $pod := include "kvrocks.podFqdn" (dict "root" $ "ordinal" $ordinal) }}

    # One server per Sentinel, up while that Sentinel names pod {{ $ordinal }} as master and
    # has a live link to it. Naming is not enough: a master pod recreated with a new address
    # is named by every Sentinel while their links still hang on the old address, sometimes
    # for longer than down-after-milliseconds. Writes routed to it then are lost when Sentinel
    # fails over to a replica that never got them.
    backend sentinel_votes_{{ $ordinal }}
      option tcp-check
      tcp-check connect
      {{- if $.Values.auth.enabled }}
      tcp-check send "AUTH ${KVROCKS_PASSWORD}\r\n"
      tcp-check expect string +OK
      {{- end }}
      tcp-check send "SENTINEL MASTER {{ $.Values.sentinel.masterName }}\r\n"
      # This field follows the address, the flags and last-ok-ping-reply: once it is there,
      # they are complete...
      tcp-check expect string last-ping-reply
      # ...so that a "no" is given right away, instead of a wait for the check timeout.
      tcp-check expect min-recv 0 string {{ $pod }}
      # "master" alone: neither s_down, nor in the middle of a failover.
      tcp-check expect min-recv 0 string "flags\r\n\$6\r\nmaster\r\n"
      # A valid reply to a ping less than 2 s ago, Sentinel pinging every second. The flags do
      # not show a link that hangs on a former address: it is not "disconnected" while its
      # connection is pending. The value has 1 to 3 digits, or 4 starting with 1.
      tcp-check expect min-recv 0 rstring "last-ok-ping-reply\r\n.([123]\r\n|4\r\n1)"
      {{- range $sentinel := $ordinals }}
      # A vote is re-read at every check, so a single answer flips it (fall 1, rise 1).
      server sentinel_{{ $sentinel }} {{ include "kvrocks.podFqdn" (dict "root" $ "ordinal" $sentinel) }}:{{ $.Values.sentinel.port }} check inter {{ $.Values.haproxy.check.interval }} fall 1 rise 1
      {{- end }}

    backend kvrocks_{{ $ordinal }}
      option tcp-check
      tcp-check connect
      {{- if $.Values.auth.enabled }}
      tcp-check send "AUTH ${KVROCKS_PASSWORD}\r\n"
      tcp-check expect string +OK
      {{- end }}
      tcp-check send "INFO replication\r\n"
      # Wait for the role line, then decide at once: a replica is a "no", not a timeout.
      tcp-check expect string role:
      tcp-check expect min-recv 0 string role:master
      # Client traffic goes to the client port, TLS included, untouched; the checks read the
      # role on the port in clear.
      server kvrocks_{{ $ordinal }} {{ $pod }}:{{ $.Values.port }} check port {{ include "kvrocks.internalPort" $ }} inter {{ $.Values.haproxy.check.interval }} fall {{ $.Values.haproxy.check.fall }} rise 1 on-marked-down shutdown-sessions
    {{- end }}
{{- end }}
