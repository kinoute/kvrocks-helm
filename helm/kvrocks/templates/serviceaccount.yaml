{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kvrocks.serviceAccountName" . }}
  labels:
    {{- include "kvrocks.labels" . | nindent 4 }}
  {{- with include "kvrocks.annotations" (dict "root" . "own" .Values.serviceAccount.annotations) }}
  {{- . | nindent 2 }}
  {{- end }}
# Nothing in the pods talks to the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
