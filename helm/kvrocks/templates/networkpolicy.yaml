{{- /* With TLS the policy is always there: the port in clear must stay inside the release. */}}
{{- if or .Values.networkPolicy.enabled .Values.tls.enabled }}
{{- $kvrocksPods := include "kvrocks.selectorLabels" (dict "root" . "component" "kvrocks") }}
{{- $haproxyPods := include "kvrocks.selectorLabels" (dict "root" . "component" "haproxy") }}
{{- /* The pod of `helm test` writes through the client port, wherever the clients come from. */}}
{{- $testPods := include "kvrocks.selectorLabels" (dict "root" . "component" "test") }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kvrocks.fullname" . }}
  labels:
    {{- include "kvrocks.labels" . | nindent 4 }}
    app.kubernetes.io/component: kvrocks
spec:
  podSelector:
    matchLabels:
      {{- $kvrocksPods | nindent 6 }}
  policyTypes:
    - Ingress
  # Port numbers, not names: a named port is looked up in the pod's containers, and the
  # Sentinel port belongs to a sidecar, which some network plugins do not look at.
  ingress:
    {{- if include "kvrocks.isReplication" . }}
    # Replication and Sentinel between the pods, and HAProxy's checks and client traffic.
    - from:
        - podSelector:
            matchLabels:
              {{- $kvrocksPods | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- $haproxyPods | nindent 14 }}
      ports:
        - port: {{ .Values.port }}
        {{- if .Values.tls.enabled }}
        - port: {{ .Values.tls.internalPort }}
        {{- end }}
        - port: {{ .Values.sentinel.port }}
    {{- end }}
    # Clients of the read Service, and Sentinel-aware clients. With TLS, Sentinel speaks in
    # clear and stays inside the release: clients only get the TLS port.
    - ports:
        - port: {{ .Values.port }}
        {{- if and (include "kvrocks.isReplication" .) (not .Values.tls.enabled) }}
        - port: {{ .Values.sentinel.port }}
        {{- end }}
      {{- with .Values.networkPolicy.clientsFrom }}
      from:
        {{- toYaml . | nindent 8 }}
        - podSelector:
            matchLabels:
              {{- $testPods | nindent 14 }}
      {{- end }}
    {{- if .Values.metrics.enabled }}
    - ports:
        - port: {{ .Values.metrics.port }}
      {{- with .Values.networkPolicy.metricsFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
{{- if include "kvrocks.isReplication" . }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kvrocks.fullname" . }}-haproxy
  labels:
    {{- include "kvrocks.labels" . | nindent 4 }}
    app.kubernetes.io/component: haproxy
spec:
  podSelector:
    matchLabels:
      {{- $haproxyPods | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: {{ .Values.port }}
      {{- with .Values.networkPolicy.clientsFrom }}
      from:
        {{- toYaml . | nindent 8 }}
        - podSelector:
            matchLabels:
              {{- $testPods | nindent 14 }}
      {{- end }}
    {{- if .Values.metrics.enabled }}
    - ports:
        - port: {{ .Values.haproxy.healthPort }}
      {{- with .Values.networkPolicy.metricsFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
{{- end }}
{{- end }}
